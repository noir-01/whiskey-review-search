services:
  mariadb:
    build: ./mariadb
    container_name: mariadb
    ports:
      - "3307:3306"
    volumes:
      - ~/docker/mariadb/etc/mysql/conf.d:/etc/mysql/conf.d:ro
      - ~/docker/mariadb/var/lib/mysql:/var/lib/mysql
      - ~/docker/mariadb/var/log/mysql:/var/log/mysql
    environment:
      - TZ=Asia/Seoul
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    restart: always
    networks:
      - proxy-network

  backend_lts:
    build:
      context: ./backend/review-api
    image: whiskey-backend:v5.1
    restart: always
    container_name: whiskey-backend-lts
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    expose:
      - "8080"
    depends_on:
      - mariadb
    networks:
      - proxy-network
  
  backend_dev:
    build:
      context: ./backend/review-api
    image: noir2001/whiskey-backend:v5.3
    container_name: whiskey-backend-test
    environment:
      - MARIADB_DATABASE=${MARIADB_DATABASE}
      - MARIADB_USER=${MARIADB_USER}
      - MARIADB_PASSWORD=${MARIADB_PASSWORD}
    ports:
      - "8081:8080"
    depends_on:
      - mariadb
    networks:
      - proxy-network

  frontend_lts:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
    image: whiskey-frontend:v5.1
    restart: always
    container_name: whiskey-frontend-lts
    expose:
      - "3000"
    networks:
      - proxy-network

  frontend_test:
    profiles: ["test"]
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
        - DISABLE_PWA=true
    image: noir2001/whiskey-frontend:v5.3
    container_name: whiskey-frontend-test
    expose:
      - "3000"
    networks:
      - proxy-network
  
  frontend_dev:
    profiles: ["test"]
    image: node:20-alpine
    container_name: whiskey-frontend-dev
    working_dir: /app
    ports:
      - "${FRONTEND_PORT:-4000}:3000"
    volumes:
      - ./frontend:/app
      - whiskey_frontend_node_modules:/app/node_modules
    environment:
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID}
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8081}
      - DISABLE_PWA=true
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    command: sh -c "yarn install --frozen-lockfile && yarn dev --hostname 0.0.0.0"
    networks:
      - proxy-network

  selenium-chrome:
    image: seleniarm/standalone-chromium:latest
    container_name: selenium-chrome
    shm_size: 2g
    expose:
      - "4444"
    environment:
      - TZ=Asia/Seoul
      - SE_NODE_MAX_SESSIONS=5
      - SE_NODE_SESSION_TIMEOUT=300
    restart: unless-stopped
    networks:
      - proxy-network

  python-app:
    build:
      context: ./backend/dc_crawling
      dockerfile: Dockerfile
    image: noir2001/whiskey-monitor:v2
    container_name: python-app
    working_dir: /app
    environment:
      - TZ=Asia/Seoul
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DB_HOST=mariadb
      - DB_PORT=3306
      - DB_NAME=${MARIADB_DATABASE}
      - DB_USER=${MARIADB_USER}
      - DB_PASSWORD=${MARIADB_PASSWORD}
      - DISPLAY=:99
      - GMAIL_EMAIL=${GMAIL_EMAIL}
      - GMAIL_PW=${GMAIL_PW}
      - CRAWL_DETAIL_SINCE=${CRAWL_DETAIL_SINCE:-}
      - CRAWL_DETAIL_LOOKBACK_DAYS=${CRAWL_DETAIL_LOOKBACK_DAYS:-30}
      - CRAWL_MAX_DETAIL_REQUESTS=${CRAWL_MAX_DETAIL_REQUESTS:-200}
      - CRAWL_TITLE_SIMILARITY_THRESHOLD=${CRAWL_TITLE_SIMILARITY_THRESHOLD:-45}
      - CRAWL_MAX_TITLE_CANDIDATES=${CRAWL_MAX_TITLE_CANDIDATES:-5}
      - CRAWL_LIST_DELAY_MIN=${CRAWL_LIST_DELAY_MIN:-1}
      - CRAWL_LIST_DELAY_MAX=${CRAWL_LIST_DELAY_MAX:-2}
      - CRAWL_DETAIL_DELAY_MIN=${CRAWL_DETAIL_DELAY_MIN:-0.8}
      - CRAWL_DETAIL_DELAY_MAX=${CRAWL_DETAIL_DELAY_MAX:-1.5}
      - CRAWL_JOB_DELAY_MIN=${CRAWL_JOB_DELAY_MIN:-3}
      - CRAWL_JOB_DELAY_MAX=${CRAWL_JOB_DELAY_MAX:-7}
      - CRAWL_LOG_DIR=${CRAWL_LOG_DIR:-/app/logs}
    depends_on:
      - mariadb
      - selenium-chrome
    networks:
      - proxy-network

networks:
  proxy-network:
    external: true

volumes:
  whiskey_frontend_node_modules:
